[daemon]
poll_interval = "3m"
max_concurrency = 3

[review]
command = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[[repository]]
name = "owner/repository"
path = "~/src/repository"
base_branches = ["main"]
authors = []
reviewers = ["your-github-login"]
teams = []
exclude_authors = ["app/dependabot", "app/renovate", "dependabot[bot]", "renovate[bot]"]
include_drafts = false
