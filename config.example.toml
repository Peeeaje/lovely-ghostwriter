[daemon]
poll_interval = "3m"
max_concurrency = 3

[review]
command = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox = "workspace-write"
marker = "codex-auto-review"
post_reviews = false
extra_args = []
instructions = ""
max_head_rechecks = 3

[patch]
enabled = false
command = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox = "workspace-write"
max_iterations = 2
branch_prefix = "develop/codex-auto-fix"
title_prefix = "[codex-auto-fix]"
extra_args = []
instructions = ""

[notification]
enabled = false
command = "auto"
timeout = "5s"
started = true
finished = true
failed = true
detected = true

[[repository]]
name = "owner/repository"
path = "~/src/repository"
base_branches = ["main"]
authors = []
reviewers = ["your-github-login"]
teams = []
exclude_authors = ["app/dependabot", "app/renovate", "dependabot[bot]", "renovate[bot]"]
include_drafts = false
initial_trigger = "review-request"
update_trigger = "review-request"

# Optional overrides for this repository:
# [repository.review]
# model = "gpt-5.6-sol"
# reasoning_effort = "high"
# instructions = "Prioritize API compatibility."

