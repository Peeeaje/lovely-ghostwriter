[daemon]
poll_interval = "3m"
max_concurrency = 3

[review]
command = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox = "workspace-write"
marker = "codex-auto-review"
post_reviews = false
extra_args = []
instructions = ""

[notification]
enabled = false
command = "terminal-notifier"
timeout = "5s"
started = true
finished = true
failed = true

[[repository]]
name = "owner/repository"
path = "~/src/repository"
base_branches = ["main"]
authors = []
reviewers = ["your-github-login"]
teams = []
exclude_authors = ["app/dependabot", "app/renovate", "dependabot[bot]", "renovate[bot]"]
include_drafts = false
initial_trigger = "review-request"
update_trigger = "review-request"

# Optional overrides for this repository:
# [repository.review]
# model = "gpt-5.6-sol"
# reasoning_effort = "high"
# instructions = "Prioritize API compatibility."
